# S3: started only by workflow_dispatch; does it satisfy a required check?
name: check
on: workflow_dispatch
permissions: {}
jobs:
  required:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - run: echo "check passed on $GITHUB_REF at $GITHUB_SHA"
      - name: Report the result as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$GITHUB_SHA" -f state=success \
            -f context=required -f target_url="$URL" --jq .state

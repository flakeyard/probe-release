name: s1-env-secrets
on: workflow_dispatch
permissions: {}
jobs:
  a-env-passed:
    uses: $/.github/workflows/called.yaml
    with: { environment: probe-env, label: a-env-passed }
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
  b-env-not-passed:
    uses: $/.github/workflows/called.yaml
    with: { environment: probe-env, label: b-env-not-passed }
  c-noenv-passed:
    uses: $/.github/workflows/called.yaml
    with: { environment: "", label: c-noenv-passed }
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
  d-noenv-not-passed:
    uses: $/.github/workflows/called.yaml
    with: { environment: "", label: d-noenv-not-passed }
  e-env-passed-missing:
    uses: $/.github/workflows/called.yaml
    with: { environment: probe-env, label: e-env-passed-missing }
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.DOES_NOT_EXIST }}
  f-env-inherit:
    uses: $/.github/workflows/called.yaml
    with: { environment: probe-env, label: f-env-inherit }
    secrets: inherit
